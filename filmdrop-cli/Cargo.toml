[package]
name = "filmdrop-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
readme.workspace = true
exclude = ["Dockerfile", "docker-compose.yml", "justfile", ".github/"]

[[bin]]
name = "filmdrop"
path = "src/main.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/{ name }-{ target }.tar.xz"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "txz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/{ name }-{ target }.zip"
pkg-fmt = "zip"

[dependencies]
filmdrop-core = { path = "../filmdrop-core", version = "0.2.3" }

anyhow.workspace = true
tokio.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
sha2.workspace = true
image.workspace = true
walkdir.workspace = true
rayon.workspace = true
indicatif.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
